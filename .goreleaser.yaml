# GoReleaser is used here only to publish GitHub Releases with
# generated release notes; this repository contains no Go code.
version: 2

builds:
  - skip: true

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: CI
      regexp: '^.*?ci(\(.+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^test:'
      - typo
      - Merge pull request
      - Merge branch

release:
  name_template: "v{{ .Version }}"
  footer: |
    **Full Changelog**: https://github.com/go-signet/brand/compare/{{ .PreviousTag }}...{{ .Tag }}
